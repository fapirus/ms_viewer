[workspace]
members = [
  "crates/viewer_core",
  "crates/viewer_ffi",
  "crates/viewer_cli",
  "crates/format_shared",
  "crates/format_docx",
  "crates/format_pptx",
  "crates/format_xlsx",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
